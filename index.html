<!-- Main Page -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Besh Kape | A Love Language</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>

<!-- Logo -->
<!-- The hero is the first large visible area of a webpage -->

<!-- Continuous coffee background with hero and parallax -->
<section class="coffee-parallax" aria-label="Besh Kape introduction">

    <!-- One image behind the entire opening section -->
    <img
        src="assets/images/menu1bg.jpg"
        alt=""
        class="coffee-image"
        aria-hidden="true"
    >

    <!-- Opening logo and information -->
    <header class="hero" id="home">
        <img
            src="assets/images/beshmainlogo.png"
            alt="Besh Kape Logo"
            class="hero-logo"
        >

        <div class="hero-info">
            <p class="hero-location">3319 C 2ND STREET (GITNA) V. MAPA STA. MESA MANILA.</p>
            <p class="hero-nearest">NEAREST LANDMARK - AMAIA SKIES STA. MESA</p>
            <p class="hero-hours">OPEN TUESDAY TO SUNDAY</p>
        </div>
    </header>

    <!-- Extends the same background below the logo -->
    <div class="coffee-parallax-extension" aria-hidden="true"></div>

</section>


<!-- About -->
    <section class="about" id="about">
        <div class="about-content">
            <p class="eyebrow">OUR STORY</p>

            <h1>More than just coffee.</h1>

            <p class="about-description">
                Basta bili ka nalang mura samin eh
            </p>

            <a href="#menu" class="about-link">
                GET TO KNOW US
            </a>
        </div>
    </section>

<!-- Menu -->
    <section class="menu-placeholder" id="menu">
        <p>OUR MENU</p>
        <h2>Pili ka na boi.</h2>
        <p>Menu coming soon.</p>
    </section>

</body>
</html>
